<div class="min-h-screen px-5 py-10" style="background-color: #faf8ef">
  <div class="max-w-5xl mx-auto space-y-8">
    
    <!-- Loading & Error -->
    <div *ngIf="loading" class="text-center text-gray-700 text-lg">
      Loading lesson...
    </div>
    <div *ngIf="error" class="text-center text-red-600">
      Could not load lesson.
    </div>

    <!-- Lesson Header -->
    <div *ngIf="!loading && lesson">
      <h1 class="text-4xl font-bold text-center mb-2" style="color: #5e4b8b">
        {{ lesson.title }}
      </h1>

      <p class="text-gray-700 text-lg leading-relaxed whitespace-pre-line bg-white p-6 rounded-xl shadow">
        {{ lesson.content }}
      </p>

      <!-- Edit Button -->
      <button
        (click)="openEditModal()"
        class="mt-4 bg-purple-700 text-white px-5 py-2 rounded-xl shadow hover:bg-purple-800 transition"
      >
        ✏️ Edit Lesson
      </button>
    </div>

    <!-- Questions -->
    <div *ngIf="lesson.questions?.length">
      <h2 class="text-2xl font-semibold mb-4" style="color: #5e4b8b">
        Lesson Questions (Created by Admin)
      </h2>

      <div class="space-y-3">
        <div *ngFor="let q of lesson.questions" class="bg-white p-4 rounded-xl shadow border border-gray-200">
          <p class="text-gray-800">{{ q.question }}</p>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ----- Edit Modal ----- -->
<div
  *ngIf="showEditModal"
  class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50"
>
  <div class="bg-white p-8 rounded-xl max-w-3xl w-full shadow-xl relative">
    <h2 class="text-3xl font-bold mb-6" style="color: #5e4b8b">Edit Lesson</h2>

    <form [formGroup]="editForm" (ngSubmit)="submitEdit()" class="space-y-6">
      
      <div>
        <label class="block mb-1 font-semibold" style="color: #5e4b8b">Title</label>
        <input
          type="text"
          formControlName="title"
          class="w-full px-4 py-3 rounded-lg border focus:outline-none focus:ring focus:ring-purple-300"
        />
      </div>

      <div>
        <label class="block mb-1 font-semibold" style="color: #5e4b8b">Content</label>
        <textarea
          formControlName="content"
          rows="6"
          class="w-full px-4 py-3 rounded-lg border focus:outline-none focus:ring focus:ring-purple-300"
        ></textarea>
      </div>

      <!-- Questions -->
      <div>
        <h3 class="text-xl font-semibold mb-2" style="color: #5e4b8b">Questions</h3>

        <div class="space-y-3">
          <div
            *ngFor="let q of questions.controls; let i = index"
            [formGroupName]="i"
            class="flex gap-3 items-center"
          >
            <input
              type="text"
              formControlName="question"
              class="flex-1 px-4 py-2 rounded-lg border focus:outline-none focus:ring focus:ring-purple-300"
            />
            <button
              type="button"
              (click)="removeQuestion(i)"
              class="px-3 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600"
            >
              Remove
            </button>
          </div>
        </div>

        <button
          type="button"
          (click)="addQuestion()"
          class="mt-3 px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700"
        >
          + Add Question
        </button>
      </div>

      <div class="flex justify-end gap-3 mt-6">
        <button type="button" (click)="closeModal()" class="px-4 py-2 rounded-lg border">Cancel</button>
        <button
          type="submit"
          [disabled]="updating"
          class="px-4 py-2 bg-purple-700 text-white rounded-lg hover:bg-purple-800"
        >
          {{ updating ? 'Updating...' : 'Update Lesson' }}
        </button>
      </div>
    </form>
  </div>
</div>
