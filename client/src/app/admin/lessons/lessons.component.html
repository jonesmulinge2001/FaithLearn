<div class="min-h-screen py-10 px-4" style="background-color: #f8f7e9">
    <div class="max-w-5xl mx-auto">
      <h1
        class="text-4xl font-bold text-center drop-shadow-sm mb-10"
        style="color: #5e4b8b"
      >
        📖 Scripture Lessons
      </h1>
  
      <!-- Loading -->
      <div *ngIf="loading" class="text-center text-gray-700 text-lg">
        Loading lessons...
      </div>
  
      <!-- Empty -->
      <div
        *ngIf="!loading && lessons.length === 0"
        class="text-center text-gray-600"
      >
        No lessons have been added yet.
      </div>
  
      <!-- Lesson Cards -->
      <div class="grid md:grid-cols-2 gap-6">
        <div
          *ngFor="let lesson of lessons"
          class="bg-white rounded-xl shadow-lg p-6 border border-gray-200 hover:shadow-2xl transition transform hover:-translate-y-1"
        >
          <h2
            class="text-2xl font-semibold mb-2"
            style="color: #5e4b8b"
          >
            {{ lesson.title }}
          </h2>
  
          <p class="text-gray-700 mb-4 line-clamp-3 font-light leading-relaxed">
            {{ lesson.content }}
          </p>
  
          <div class="flex justify-between items-center">
            <span class="font-semibold" style="color: #ceac3e">
              {{ lesson.questions?.length || 0 }} Questions
            </span>
  
            <!-- VIEW BUTTON WITH GRADIENT -->
            <button
              [routerLink]="['/admin/lessons', lesson.id]"
              class="text-white px-4 py-2 rounded-lg shadow transition"
              style="background: linear-gradient(90deg, #ceac3e, #436adf)"
            >
              View Lesson
            </button>
          </div>
        </div>
      </div>
    </div>
  
    <!-- ⭐ FLOATING CREATE BUTTON ⭐ -->
    <button
      [routerLink]="['/admin/create-lesson']"
      class="fixed bottom-8 right-8 text-white w-14 h-14 rounded-full shadow-xl flex items-center justify-center text-3xl transition hover:scale-105"
      style="background: linear-gradient(90deg, #ceac3e, #436adf)"
      title="Create Lesson"
    >
      +
    </button>
  </div>
