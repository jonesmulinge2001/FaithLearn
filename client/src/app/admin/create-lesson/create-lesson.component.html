<div
  class="min-h-screen px-5 py-10"
  style="background-color: #faf8ef"
>
  <div class="max-w-3xl mx-auto bg-white p-8 rounded-xl shadow-xl border">

    <!-- Title -->
    <h1
      class="text-4xl font-bold mb-8 text-center"
      style="color: #5e4b8b"
    >
      Create New Lesson
    </h1>

    <!-- Success Message -->
    <div
      *ngIf="success"
      class="mb-4 p-3 bg-green-100 text-green-700 rounded"
    >
      Lesson created successfully!
    </div>

    <!-- Error Message -->
    <div
      *ngIf="error"
      class="mb-4 p-3 bg-red-100 text-red-700 rounded"
    >
      Something went wrong. Try again.
    </div>

    <form (ngSubmit)="submitLesson()" [formGroup]="lessonForm" class="space-y-6">
      
      <!-- Lesson Title -->
      <div>
        <label
          class="block mb-1 font-semibold"
          style="color: #5e4b8b"
        >
          Lesson Title
        </label>
        <input
          formControlName="title"
          type="text"
          class="w-full px-4 py-3 rounded-lg border focus:outline-none focus:ring focus:ring-purple-300"
        />
      </div>

      <!-- Lesson Content -->
      <div>
        <label
          class="block mb-1 font-semibold"
          style="color: #5e4b8b"
        >
          Lesson Content
        </label>
        <textarea
          formControlName="content"
          rows="8"
          class="w-full px-4 py-3 rounded-lg border focus:outline-none focus:ring focus:ring-purple-300 leading-relaxed"
        ></textarea>
      </div>

<!-- Dynamic Questions -->
<div>
    <h2
      class="text-2xl font-semibold mb-3"
      style="color: #5e4b8b"
    >
      Add Questions
    </h2>
  
    <!-- IMPORTANT WRAPPER -->
    <div formArrayName="questions" class="space-y-4">
      <div
        *ngFor="let q of questions.controls; let i = index"
        [formGroupName]="i"
        class="p-4 rounded-lg bg-purple-50 border border-purple-200"
      >
        <label
          class="block mb-1 font-medium"
          style="color: #5e4b8b"
        >
          Question {{ i + 1 }}
        </label>
  
        <div class="flex gap-3 items-center">
          <input
            type="text"
            formControlName="question"
            class="flex-1 px-4 py-2 rounded-lg border focus:outline-none focus:ring focus:ring-purple-300"
          />
  
          <button
            type="button"
            class="px-3 py-2 rounded-lg bg-red-500 text-white hover:bg-red-600 text-sm"
            (click)="removeQuestion(i)"
          >
            Remove
          </button>
        </div>
      </div>
    </div>
  
    <!-- Add Question Button -->
    <button
      type="button"
      class="mt-4 px-4 py-2 bg-purple-600 text-white rounded-lg shadow hover:bg-purple-700"
      (click)="addQuestion()"
    >
      + Add Question
    </button>
  </div>
  

      <!-- Submit Button -->
      <button
        [disabled]="loading"
        type="submit"
        class="w-full py-3 rounded-lg text-white font-semibold shadow"
        [class.bg-purple-700]="!loading"
        [class.bg-purple-400]="loading"
      >
        {{ loading ? 'Creating...' : 'Create Lesson' }}
      </button>
    </form>
  </div>
</div>
