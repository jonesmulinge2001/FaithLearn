<div class="min-h-screen p-6" style="background-color: #fffcef">
  <div class="max-w-3xl mx-auto bg-white p-6 rounded-2xl shadow-xl">
    <!-- LESSON FOUND -->
    <ng-container *ngIf="lesson; else noLesson">
      <!-- Header -->
      <div class="border-b pb-4">
        <h1 class="text-3xl font-bold flex items-center gap-2">
          <span class="material-icons text-purple-600">menu_book</span>
          {{ lesson.title }}
        </h1>
        <p class="text-sm text-gray-500 mt-1">
          <span class="material-icons text-xs align-middle">schedule</span>
          {{ lesson.createdAt | date : "medium" }}
        </p>
      </div>

      <!-- Content -->
      <div class="mt-6">
        <h2 class="text-xl font-semibold flex items-center gap-2">
          <span class="material-icons text-yellow-600">article</span>
          Lesson Content
        </h2>

        <div class="mt-3 p-4 bg-white border rounded-xl shadow-sm">
          <div class="prose max-w-none" [innerHTML]="lesson.content"></div>
        </div>
      </div>

      <!-- Questions -->
      <div class="mt-8">
        <h2 class="text-xl font-semibold flex items-center gap-2">
          <span class="material-icons text-blue-600">help_outline</span>
          Lesson Questions
        </h2>

        <div
          *ngIf="(lesson.questions?.length ?? 0) === 0"
          class="text-gray-600 mt-2 italic"
        >
          No questions for this lesson.
        </div>

        <div class="mt-4 space-y-6">
          <div
            *ngFor="let q of lesson.questions"
            class="p-5 bg-white border rounded-xl shadow-md"
          >
            <p class="font-medium flex items-center gap-2 text-gray-800">
              <span class="material-icons text-purple-500"
                >question_answer</span
              >
              {{ q.question }}
            </p>

            <textarea
              class="mt-3 w-full rounded-xl border p-3 min-h-[100px] focus:ring-2 focus:ring-purple-400 outline-none"
              [(ngModel)]="answersMap[q.id!]"
              [readonly]="isQuestionSubmitted(q) || reviewMode"
              placeholder="Write your answer here..."
            ></textarea>

            <div class="mt-3 flex items-center gap-3">
              <button
                class="px-4 py-2 rounded-xl text-white font-medium shadow-md bg-gradient-to-r from-[#9535e5] to-[#f39b12]"
                (click)="submitAnswer(q.id!)"
                [disabled]="
                  isQuestionSubmitted(q) ||
                  reviewMode ||
                  submittingQuestionId === q.id
                "
                *ngIf="!reviewMode"
              >
                <span class="material-icons text-sm align-middle">
                  {{
                    isQuestionSubmitted(q)
                      ? "check_circle"
                      : submittingQuestionId === q.id
                      ? "hourglass_top"
                      : "send"
                  }}
                </span>

                {{
                  isQuestionSubmitted(q)
                    ? "Submitted"
                    : submittingQuestionId === q.id
                    ? "Submitting..."
                    : "Submit Answer"
                }}
              </button>

              <span
                *ngIf="isQuestionSubmitted(q)"
                class="text-sm text-green-700 flex items-center gap-1"
              >
                <span class="material-icons text-base">verified</span>
                Answer submitted
              </span>
            </div>
          </div>
        </div>
      </div>

      <!-- Ask Admin Section -->
      <div class="mt-10 border-t pt-6">
        <h3 class="text-xl font-semibold flex items-center gap-2">
          <span class="material-icons text-red-500">support_agent</span>
          Ask Admin a Question
        </h3>

        <textarea
          class="mt-3 w-full rounded-xl border p-3 min-h-[100px] focus:ring-2 focus:ring-purple-400 outline-none"
          [(ngModel)]="studentQuestion"
          placeholder="Ask the admin about this lesson..."
        ></textarea>

        <div class="mt-3">
          <button
            class="px-4 py-2 rounded-xl text-white font-medium shadow-md bg-gradient-to-r from-[#9535e5] to-[#f39b12]"
            (click)="askAdmin()"
          >
            <span class="material-icons text-sm align-middle">send</span>
            Send Question
          </button>
        </div>
      </div>
    </ng-container>

    <!-- LESSON NOT FOUND -->
    <ng-template #noLesson>
      <div class="text-center py-12 text-gray-600">
        <span class="material-icons text-5xl mb-3 text-gray-400"
          >error_outline</span
        >
        <p>Lesson not found.</p>
      </div>
    </ng-template>
  </div>
</div>
