<div class="min-h-screen w-full" style="background-color: #fffcef;">
  <div class="max-w-4xl mx-auto">

    <!-- HEADER -->
    <h1 class="text-xl font-bold mb-6 flex items-center  gap-2">
      <span class="material-icons text-purple-600">menu_book</span>
      Available Courses
    </h1>

    <!-- LOADING -->
    <div *ngIf="loading" class="text-gray-500 flex items-center gap-2">
      <span class="material-icons animate-spin">autorenew</span>
      Loading...Please wait
    </div>
    
    <!-- COURSES VIEW -->
    <div *ngIf="!viewingLessonsForCourse" class="grid gap-6 sm:grid-cols-2 mt-4">
      <div *ngFor="let course of courses" class="bg-white rounded-2xl p-5 shadow-xl border hover:shadow-2xl transition">
        <h2 class="text-xl font-semibold text-gray-800 flex items-center gap-2">
          <span class="material-icons text-yellow-700">library_books</span>
          {{ course.title }}
        </h2>
        <p class="text-gray-600 mt-2 line-clamp-3">{{ course.description || 'No description.' }}</p>

        <div class="mt-4 flex gap-3">
          <button
            class="px-2 py-1 rounded-full text-sm text-white font-medium shadow bg-gradient-to-r from-purple-600 to-orange-500 flex items-center gap-2"
            (click)="viewLessons(course.id)"
            *ngIf="enrolledCourseIds.has(course.id)"
          >
            <span class="material-icons text-sm">menu_book</span> View Lessons
          </button>

          <button
            *ngIf="!enrolledCourseIds.has(course.id)"
            class="px-4 py-2 rounded-xl text-white font-medium shadow bg-green-600 hover:bg-green-700 flex items-center gap-2"
            (click)="enroll(course.id)"
          >
            <span class="material-icons text-sm">check_circle</span> Enroll
          </button>

          <span *ngIf="enrolledCourseIds.has(course.id)" class="px-3 py-1 rounded-xl bg-green-100 text-green-800 text-sm flex items-center gap-1">
            <span class="material-icons text-sm">verified</span> Enrolled
          </span>
        </div>
      </div>
    </div>

    <!-- LESSONS VIEW -->
    <div *ngIf="viewingLessonsForCourse" class="mt-6">
      <button class="px-4 py-2 mb-2 text-xs rounded-full text-white font-medium shadow bg-gradient-to-r from-purple-600 to-orange-500 flex items-center " (click)="backToCourses()">
        &larr; Back to Courses
      </button>

      <div class="grid gap-6 sm:grid-cols-2">
        <div *ngFor="let lesson of lessons; let i = index" class="bg-white p-4 rounded-xl shadow border">
          <div class="flex justify-between items-center">
            <h2 class="text-lg font-semibold flex items-center gap-2">
              <span class="material-icons text-yellow-700">book</span> {{ lesson.title }}
            </h2>
            <span *ngIf="statuses[lesson.id] === 'COMPLETED'" class="text-green-600 text-sm flex items-center gap-1">
              <span class="material-icons text-sm">verified</span> Completed
            </span>
          </div>

          <p class="text-gray-600 mt-2 line-clamp-2">{{ lesson.content }}</p>

          <button
            (click)="startLesson(lesson, i)"
            [class.opacity-50]="!canStartLesson(i)"
            class="mt-3 text-xs px-4 py-2 rounded-full text-white font-medium shadow bg-gradient-to-r from-purple-600 to-orange-500"
          >
            Start Lesson
          </button>
        </div>
      </div>
    </div>

  </div>
</div>
