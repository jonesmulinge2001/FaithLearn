<div class="min-h-screen p-6" style="background-color: #fffcef;">
  <div class="max-w-4xl mx-auto">

    <!-- HEADER -->
    <h1 class="text-3xl font-bold mb-6 flex items-center gap-2">
      <span class="material-icons text-purple-600">menu_book</span>
      Lessons
    </h1>

    <!-- LOADING -->
    <div *ngIf="loading" class="text-gray-500 flex items-center gap-2">
      <span class="material-icons animate-spin">autorenew</span>
      Loading lessons…
    </div>

    <!-- GRID -->
    <div class="grid gap-6 sm:grid-cols-2 mt-4">

      <div
        *ngFor="let lesson of lessons"
        class="bg-white rounded-2xl p-5 shadow-xl border hover:shadow-2xl transition-shadow duration-300"
      >

        <!-- TOP SECTION -->
        <div class="flex justify-between items-start">
          <div>
            <h2 class="text-xl font-semibold flex items-center gap-2 text-gray-800">
              <span class="material-icons text-yellow-700">book</span>
              {{ lesson.title }}
            </h2>

            <p class="text-sm text-gray-500 mt-1 flex items-center gap-1">
              <span class="material-icons text-xs">schedule</span>
              {{ lesson.createdAt | date:'mediumDate' }}
            </p>
          </div>

          <!-- STATUS BADGE -->
          <div class="text-right">

            <!-- COMPLETED -->
            <span
              *ngIf="statuses[lesson.id] === 'COMPLETED'"
              class="inline-flex items-center gap-1 px-3 py-1 text-xs rounded-full bg-green-100 text-green-800"
            >
              <span class="material-icons text-sm">verified</span>
              Completed
            </span>

            <!-- IN PROGRESS -->
            <span
              *ngIf="statuses[lesson.id] === 'IN_PROGRESS'"
              class="inline-flex items-center gap-1 px-3 py-1 text-xs rounded-full bg-yellow-100 text-yellow-800"
            >
              <span class="material-icons text-sm">hourglass_bottom</span>
              In progress
            </span>

            <!-- NOT STARTED -->
            <span
              *ngIf="statuses[lesson.id] === 'NOT_STARTED'"
              class="inline-flex items-center gap-1 px-3 py-1 text-xs rounded-full bg-[#e9dcbe] text-gray-700"
            >
              <span class="material-icons text-sm">fiber_manual_record</span>
              Not started
            </span>
          </div>
        </div>

        <!-- LESSON PREVIEW -->
        <p class="text-gray-700 mt-4 line-clamp-3">
          {{ lesson.content }}
        </p>

        <!-- ACTION BUTTONS -->
        <div class="mt-5 flex gap-3">

          <!-- START / CONTINUE BUTTON -->
          <button
            (click)="startLesson(lesson)"
            *ngIf="statuses[lesson.id] !== 'COMPLETED'"
            class="px-4 py-2 rounded-xl text-white font-medium shadow-md
            bg-gradient-to-r from-[#9535e5] to-[#f39b12] flex items-center gap-2"
          >
            <span class="material-icons text-sm">play_arrow</span>
            {{ getStatusLabel(statuses[lesson.id]) }} Lesson
          </button>

          <!-- REVIEW BUTTON -->
          <button
            (click)="reviewLesson(lesson)"
            *ngIf="statuses[lesson.id] === 'COMPLETED'"
            class="px-4 py-2 rounded-xl text-white font-medium shadow-md
            bg-gradient-to-r from-[#9535e5] to-[#f39b12] flex items-center gap-2"
          >
            <span class="material-icons text-sm">visibility</span>
            Review Lesson
          </button>

        </div>

      </div>
    </div>
  </div>
</div>
