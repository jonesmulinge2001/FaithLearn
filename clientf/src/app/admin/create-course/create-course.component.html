<div class="min-h-screen" style="background-color: #f8f6e7;">
    <div class="max-w-3xl mx-auto bg-white p-6 rounded-lg shadow-md">
        <h2 class="text-2xl font-bold mb-4" style="color: #d2ae39;">Create New Course</h2>

        <!-- Success or Error Messages -->
         <div *ngIf="successMessage" class="mb-4 p-3 rounded" style="background-color: #1df361; color: white;">
            {{ successMessage}}
         </div>
         <div *ngIf="errormessage" class="mb-4 p-3 rounded bg-red-500 text-white">
            {{ errormessage}}
         </div>

         <form [formGroup]="courseForm" (ngSubmit)="submitCourse()">
            <!-- title -->
             <div class="mb-4">
                <label class="block font-semibold mb-1" style="color: #d2ae39;">Course Title</label>
                <input
                    formControlName="title"
                    placeholder="Course Title"
                    class="w-full px-3 py-2 border rounded"
                    type="text"
                />
             </div>

             <!-- Submit Button -->
              <button
              type="submit"
              [disabled]="submitting"
              class="w-full py-3 rounded text-white font-bold mt-4"
              style="background-color: #d2ae39;"
              >
              {{ submitting? 'Submitting...': 'Create Course'}}
              </button>
         </form>
    </div>
</div>
