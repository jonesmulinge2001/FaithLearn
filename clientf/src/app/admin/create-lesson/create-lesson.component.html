<!-- src/app/components/create-lesson/create-lesson.component.html -->
<div class="min-h-screen p-1" style="background-color: #f8f6e7;">
  <div class="max-w-3xl mx-auto bg-white p-6 rounded-lg shadow-md">
    <h2 class="text-2xl font-bold mb-4" style="color: #d2ae39;">Create New Lesson</h2>

    <!-- Success / Error Messages -->
    <div *ngIf="successMessage" class="mb-4 p-3 rounded" style="background-color: #d2ae39; color: white;">
      {{ successMessage }}
    </div>
    <div *ngIf="errorMessage" class="mb-4 p-3 rounded bg-red-500 text-white">
      {{ errorMessage }}
    </div>

    <form [formGroup]="lessonForm" (ngSubmit)="submitLesson()">
      <!-- Title -->
      <div class="mb-4">
        <label class="block font-semibold mb-1" style="color: #d2ae39;">Title</label>
        <input
          formControlName="title"
          type="text"
          placeholder="Lesson Title"
          class="w-full px-3 py-2 border rounded"
          style="border-color: #d2ae39;"
        />
      </div>

      <!-- Content -->
      <div class="mb-4">
        <label class="block font-semibold mb-1" style="color: #d2ae39;">Content</label>
        <textarea
          formControlName="content"
          rows="5"
          placeholder="Lesson Content"
          class="w-full px-3 py-2 border rounded"
          style="border-color: #d2ae39;"
        ></textarea>
      </div>

      <!-- Course Selection -->
      <div class="mb-4">
        <label class="block font-semibold mb-1" style="color: #d2ae39;">Course</label>
        <select
          formControlName="courseId"
          class="w-full px-3 py-2 border rounded"
          style="border-color: #d2ae39;"
        >
          <option value="">Select a course</option>
          <option *ngFor="let course of courses" [value]="course.id">{{ course.title }}</option>
        </select>
      </div>

      <!-- Questions -->
      <div formArrayName="questions" class="mb-4">
        <label class="block font-semibold mb-2" style="color: #d2ae39;">Questions</label>
        <div *ngFor="let q of questions.controls; let i=index" [formGroupName]="i" class="mb-2 flex items-center gap-2">
          <input
            formControlName="question"
            type="text"
            placeholder="Question"
            class="flex-1 px-3 py-2 border rounded"
            style="border-color: #d2ae39;"
          />
          <button type="button" (click)="removeQuestion(i)" class="px-3 py-1 rounded text-white" style="background-color: #d2ae39;">
            Remove
          </button>
        </div>
        <button type="button" (click)="addQuestion()" class="mt-2 px-4 py-2 rounded text-white" style="background-color: #d2ae39;">
          Add Question
        </button>
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        [disabled]="submitting"
        class="w-full py-3 rounded text-white font-bold mt-4"
        style="background-color: #d2ae39;"
      >
        {{ submitting ? 'Submitting...' : 'Create Lesson' }}
      </button>
    </form>
  </div>
</div>
